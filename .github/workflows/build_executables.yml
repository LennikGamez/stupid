name: Build release executables
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  pyinstaller_and_upload:
    name: Build and upload for ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            artifact_name: stupid
            asset_name: stupid_linux_x86_64_${{github.ref_name}}
          - os: ubuntu-26.04-arm
            artifact_name: stupid
            asset_name: stupid_linux_arm64_${{github.ref_name}}
          - os: macos-latest
            artifact_name: stupid
            asset_name: stupid_macos_arm64_${{github.ref_name}}
          - os: windows-latest
            artifact_name: stupid.exe
            asset_name: stupid_windows_x86_64_${{github.ref_name}}.exe
          - os: windows-11-arm
            artifact_name: stupid.exe
            asset_name: stupid_windows_arm64_${{github.ref_name}}.exe
    steps:
      - name: Build ${{matrix.os}}
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.14'
          #pyinstaller_ver: '==5.13.2'
          spec: 'stupid_onefile.spec'
          requirements: 'requirements.txt'
          # upload_exe_with_name: ${{matrix.asset_name}}
      - name: Upload ${{matrix.os}}
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

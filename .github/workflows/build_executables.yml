name: Build release executables
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  pyinstaller_and_upload:
    name: Build and upload for ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: stupid
            asset_name: stupid_linux_${{github.ref_name}}
          - os: macos-latest
            artifact_name: stupid
            asset_name: stupid_macos_${{github.ref_name}}.app
          - os: windows-latest
            artifact_name: stupid.exe
            asset_name: stupid_windows_${{github.ref_name}}.exe
    steps:
      - name: Build ${{matrix.os}}
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.14'
          #pyinstaller_ver: '==5.13.2'
          spec: 'src/main.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: ${{matrix.asset_name}}
          options: --onefile, --name "stupid", --console
      - name: Upload ${{matrix.os}}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}

name: update_brew_tap.yml
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update_brew_tap:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          path: stupid
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: arm64
      - env:
          VERSION_TAG: ${{ github.ref_name }}
        working-directory:
          stupid
        run: |
          export VERSION="${VERSION_TAG#v}"
          pip install uv
          pip install uvbrew
          uv init --bare
          uv add -r requirements.txt
          uv version "$VERSION"
          uvbrew > stupid.rb
          uv build --sdist
      - name: upload packages to forgejo
        working-directory:
          stupid
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          BASE: https://git.aws1313.de/api/packages/aws1313
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION_TAG#v}"
          set -euo pipefail
          curl -X PUT --fail --user "aws1313:$TOKEN" --upload-file "dist/stupid-$VERSION.tar.gz" "$BASE/generic/stupid/$VERSION/stupid-$VERSION.tar.gz"
      - name: wait some seconds so forgejo has time
        run: |
          sleep 20s

      - uses: actions/checkout@v7
        with:
          path: tap
          token: ${{ secrets.TAP_TOKEN }}
          repository: aws1313/homebrew-tap

      - working-directory: tap
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          BASE: https://git.aws1313.de/api/packages/aws1313
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          mv ../stupid/stupid.rb Formula/stupid.rb
          export VERSION="${VERSION_TAG#v}"
          export FILESUM=$(shasum -a 256 ../stupid/dist/stupid-$VERSION.tar.gz |awk '{print $1}')
          awk -v version="$VERSION" '!done && sub(/url "file:[^"]*"/, "url \"https://git.aws1313.de/api/packages/aws1313/generic/stupid/"version"/stupid-"version".tar.gz\"") { done=1 } 1' Formula/stupid.rb > temp.txt && mv temp.txt Formula/stupid.rb
          awk -v filesum="$FILESUM" '!done && sub(/sha256 "[^"]*"/, "sha256 \""filesum"\"\n  desc \"a CLI and tray client for certain features of stud.ip\"\n  homepage \"https://github.com/LennikGamez/stupid\"\n  license \"GPL-3.0\"") { done=1 } 1' Formula/stupid.rb > temp.txt && mv temp.txt Formula/stupid.rb
          awk '/^  resource "(cryptography|cffi|pycparser|secretstorage|jeepney|pywin32-ctypes)" do$/{s=1;next} s&&/^  end$/{s=0;b=1;next} s{next} b&&/^$/{b=0;next} {b=0;print}' Formula/stupid.rb > temp.txt && mv temp.txt Formula/stupid.rb
          awk '/^  def install$/{i=1;print "  def install\n    virtualenv_install_with_resources\n\n    (bin/\"stupid\").write <<~EOS\n      #!/bin/bash\n      export STUPID_HOMEBREW=1\n      exec \"#{libexec}/bin/python\" -m main \"$@\"\n    EOS\n    (bin/\"stupid\").chmod 0755\n  end";next} i&&/^  end$/{i=0;next} i{next} {print}' Formula/stupid.rb > temp.txt && mv temp.txt Formula/stupid.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stupid.rb
          git commit -m "generated"
          git push

          
        
      


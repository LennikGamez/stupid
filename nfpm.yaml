name: "stupid"
arch: ${ARCH}
platform: "linux"
version: ${VERSION}
section: "default"
priority: "extra"
maintainer: "aws1313 <69417093+aws1313@users.noreply.github.com>"
description: |
  cli client for certain stud.ip features
vendor: "aws1313"
homepage: "https://github.com/LennikGamez/stupid"
license: "GPL-3.0"
#changelog: "changelog.yml"
contents:
  - src: dist/main/
    dst: /opt/stupid/
    type: tree

  - src: /opt/stupid/stupid
    dst: /usr/bin/stupid
    type: symlink

  - src: LICENSE
    dst: /usr/share/doc/stupid/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/stupid/LICENSE
    packager: rpm

  - src: LICENSE
    dst: /usr/share/licenses/stupid/LICENSE
    packager: archlinux

  - src: LICENSES.html
    dst: /usr/share/doc/stupid/third_party_copyright.html
    packager: deb
  - src: LICENSES.html
    dst: /usr/share/licenses/stupid/THIRD_PARTY_LICENSES.html
    packager: rpm

  - src: LICENSES.html
    dst: /usr/share/licenses/stupid/THIRD_PARTY_LICENSES.html
    packager: archlinux


